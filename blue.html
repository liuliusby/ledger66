<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="蓝蓝帐">
  <link rel="apple-touch-icon" href="blue-icon.png">
  <meta name="theme-color" content="#1a3a5c">
  <title>蓝蓝帐</title>
  <style>
    :root {
      --ink:#1a3a5c; --ink-2:#2d5a8a; --muted:#6b9bc3;
      --line:#c5d4e3; --line-2:#dce6f0; --paper:#fff; --bg:#eef4f9;
      --accent:#3b9eff; --accent-strong:#2580e0; --accent-soft:#e8f4ff;
      --success:#34a853; --success-soft:#e8f5ea;
      --danger:#ea4335; --danger-soft:#fce8e6;
      --shadow:0 8px 28px rgba(26,58,92,.08);
      --safe-b:env(safe-area-inset-bottom,0px);
      --cream:#f0f6fc; --ink-black:#1a3a5c; --tape:#d4e3f0;
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html,body { height:100%; margin:0; }
    body {
      background:var(--cream); color:var(--ink-black);
      font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      -webkit-tap-highlight-color:transparent;
    }
    #app { display:flex; flex-direction:column; height:100%; max-width:520px; margin:0 auto; background:var(--cream); }
    #appHeader {
      padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 12px;
      background:linear-gradient(135deg,#1a3a5c,#2563a8); color:#fff;
      border-radius:0 0 24px 24px;
    }
    #appHeader h1 { margin:0; font-size:26px; font-weight:800; letter-spacing:.02em; }
    #appHeader .head-sub { color:rgba(255,255,255,.55); font-size:11px; letter-spacing:.18em; text-transform:uppercase; }
    #appMain { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px 24px; }
    #appNav {
      display:flex; padding:8px 12px calc(8px + var(--safe-b));
      background:linear-gradient(135deg,#1a3a5c,#2563a8);
      border-radius:24px 24px 0 0;
    }
    .nav-btn {
      flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
      padding:8px 0 5px; border:none; background:none; color:rgba(255,255,255,.45);
      font-size:11px; font-weight:650; letter-spacing:.08em; min-height:auto; border-radius:10px; cursor:pointer;
    }
    .nav-btn svg { width:23px; height:23px; }
    .nav-btn.active { color:#fff; background:rgba(255,255,255,.15); }
    .page { display:none; }
    .page.active { display:block; }
    .card { background:var(--paper); border:2px solid var(--ink); border-radius:18px; padding:18px 16px; margin-bottom:16px; box-shadow:5px 5px 0 rgba(26,58,92,.12); }
    .card h3 { margin:0 0 14px; font-size:12px; font-weight:800; letter-spacing:.22em; color:var(--ink); text-transform:uppercase; border-bottom:2px solid var(--accent); padding-bottom:8px; }
    .amount-box { display:flex; align-items:baseline; gap:6px; margin-bottom:4px; }
    .amount-box .cny { font-size:26px; font-weight:800; color:var(--ink); }
    #amountInput {
      flex:1; width:100%; min-width:0; min-height:56px; border:none; border-radius:0; background:none;
      font-size:44px; font-weight:800; letter-spacing:-.02em; padding:0; color:var(--ink);
      font-variant-numeric:tabular-nums; -moz-appearance:textfield; appearance:textfield;
    }
    #amountInput::-webkit-outer-spin-button,#amountInput::-webkit-inner-spin-button { -webkit-appearance:none; }
    #amountInput::placeholder { color:var(--tape); }
    .amount-rule { height:0; border-bottom:2px dashed var(--tape); margin:8px 0 16px; }
    .cat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
    .cat-btn {
      min-height:auto; padding:13px 4px 10px; border-radius:14px; font-size:13.5px; font-weight:650;
      background:var(--paper); border:2px solid var(--ink); color:var(--ink); cursor:pointer;
      box-shadow:3px 3px 0 rgba(26,58,92,.12); transition:all .15s;
    }
    .cat-btn.sel { background:var(--ink); color:#fff; box-shadow:none; transform:translate(3px,3px); }
    .field-row { display:flex; gap:10px; margin-bottom:14px; }
    .field-row label { flex:1; display:grid; gap:5px; color:var(--ink-2); font-size:11px; font-weight:700; letter-spacing:.1em; }
    .field-row input { min-width:0; min-height:42px; border-radius:10px; border:2px solid var(--ink); padding:0 11px; font:inherit; font-weight:600; width:100%; background:var(--paper); }
    .save-btn {
      width:100%; min-height:52px; border:2px solid var(--ink); border-radius:14px;
      background:var(--accent); color:#fff; font-size:17px; font-weight:800; letter-spacing:.3em; cursor:pointer;
      box-shadow:4px 4px 0 rgba(26,58,92,.2);
    }
    .save-btn:active { box-shadow:none; transform:translate(4px,4px); }
    /* list */
    .list-empty { text-align:center; padding:48px 20px; color:var(--muted); }
    .list-empty .empty-mascot { width:140px; height:140px; border-radius:28px; object-fit:cover; object-position:top; border:2px solid var(--ink); box-shadow:5px 5px 0 rgba(26,58,92,.12); margin:0 auto 14px; display:block; background:var(--paper); }
    .list-item { display:flex; align-items:center; gap:12px; padding:14px 12px; border-bottom:1px solid var(--line-2); }
    .list-item:last-child { border-bottom:none; }
    .cat-dot { width:10px; height:10px; border-radius:50%; flex:none; }
    .list-item-info { flex:1; min-width:0; }
    .list-item-info .li-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px; }
    .list-item-info .li-cat { font-size:12px; font-weight:700; color:var(--ink-2); }
    .list-item-info .li-amt { font-size:17px; font-weight:800; color:var(--ink); }
    .list-item-info .li-note { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .list-item-info .li-date { font-size:11px; color:var(--muted); }
    .del-btn { width:32px; height:32px; border-radius:8px; border:2px solid var(--line); background:none; color:var(--muted); font-size:16px; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center; }
    .del-btn:hover { border-color:var(--danger); color:var(--danger); }
    /* filter bar */
    .filter-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
    .filter-chip {
      padding:6px 14px; border-radius:20px; border:2px solid var(--line); background:var(--paper);
      font-size:12px; font-weight:600; color:var(--ink-2); cursor:pointer; white-space:nowrap;
    }
    .filter-chip.active { background:var(--ink); color:#fff; border-color:var(--ink); }
    /* stats */
    .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
    .stat-card { background:var(--paper); border:2px solid var(--line); border-radius:14px; padding:14px; text-align:center; }
    .stat-card .stat-val { font-size:24px; font-weight:800; color:var(--ink); }
    .stat-card .stat-lbl { font-size:11px; color:var(--muted); font-weight:600; margin-top:2px; }
    .sum-row { display:flex; align-items:center; gap:12px; background:linear-gradient(135deg,var(--ink),#2563a8); color:#fff; border-radius:14px; padding:16px; margin-bottom:16px; }
    .sum-mascot { width:64px; height:64px; border-radius:16px; border:2px solid rgba(255,255,255,.3); object-fit:cover; object-position:top; flex:none; }
    .sum-info { flex:1; min-width:0; }
    .sum-info .sum-val { font-size:32px; font-weight:800; }
    .sum-info .sum-lbl { font-size:12px; opacity:.7; }
    .cat-sum-item { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line-2); }
    .cat-sum-item:last-child { border-bottom:none; }
    .cat-sum-left { display:flex; align-items:center; gap:8px; }
    .cat-bar { width:6px; height:60%; border-radius:0 4px 4px 0; }
  </style>
</head>
<body>
<div id="app">
  <div id="appHeader">
    <div class="head-sub">BLUE LEDGER</div>
    <h1 id="headerTitle">蓝蓝帐</h1>
  </div>

  <!-- 记账页 -->
  <div id="pageAdd" class="page active">
    <div id="appMain">
      <div class="card">
        <h3>记一笔</h3>
        <div class="amount-box"><span class="cny">¥</span></div>
        <input type="number" id="amountInput" placeholder="0.00" inputmode="decimal">
        <div class="amount-rule"></div>
        <div class="cat-grid" id="catGrid"></div>
        <div class="field-row">
          <label>日期<input type="date" id="fDate"></label>
          <label>备注<input type="text" id="fNote" placeholder="选填"></label>
        </div>
        <button class="save-btn" id="saveBtn">记下来</button>
      </div>
    </div>
  </div>

  <!-- 明细页 -->
  <div id="pageList" class="page">
    <div id="appMain">
      <div class="filter-bar" id="filterBar"></div>
      <div id="listArea"></div>
    </div>
  </div>

  <!-- 统计页 -->
  <div id="pageStats" class="page">
    <div id="appMain">
      <div id="statsArea"></div>
    </div>
  </div>

  <div id="appNav">
    <button class="nav-btn active" data-page="pageAdd">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      记
    </button>
    <button class="nav-btn" data-page="pageList">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 6h18M7 12h10M10 18h4"/></svg>
      帐
    </button>
    <button class="nav-btn" data-page="pageStats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
      统
    </button>
  </div>
</div>

<script>
var KEY = 'moma-blue-records';
var CATEGORIES = [
  { name:'经营所需', icon:'💼', color:'#2563eb', bg:'#e8f0fe' },
  { name:'口腹之欲', icon:'🍜', color:'#ea580c', bg:'#fef0e8' },
  { name:'情绪价值', icon:'🎀', color:'#d946ef', bg:'#fae8ff' },
  { name:'人情世故', icon:'🎁', color:'#059669', bg:'#e6f5ed' },
  { name:'小小厨神', icon:'👨‍🍳', color:'#ca8a04', bg:'#fdf6e8' },
];
var records = [];
try { records = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { records=[]; }

function $(id){ return document.getElementById(id); }

/* nav */
document.querySelectorAll('.nav-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
    this.classList.add('active');
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    $(this.dataset.page).classList.add('active');
    if(this.dataset.page==='pageList') renderList();
    if(this.dataset.page==='pageStats') renderStats();
  });
});

/* categories */
var curCat = CATEGORIES[0].name;
var grid = $('catGrid');
CATEGORIES.forEach(function(c){
  var b = document.createElement('button');
  b.className='cat-btn'; b.textContent=c.icon+' '+c.name;
  b.style.setProperty('--cat-color',c.color);
  b.addEventListener('click', function(){
    document.querySelectorAll('.cat-btn').forEach(function(x){x.classList.remove('sel');});
    this.classList.add('sel'); curCat=c.name;
  });
  grid.appendChild(b);
});
if(grid.firstChild) grid.firstChild.classList.add('sel');

/* date default */
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
$('fDate').value=todayStr();

/* save */
$('saveBtn').addEventListener('click', function(){
  var amt=$('amountInput').value;
  if(!amt||Number(amt)<=0){ $('amountInput').focus(); return; }
  records.push({id:Date.now()+'-'+Math.floor(Math.random()*1e5),date:$('fDate').value||todayStr(),cat:curCat,amount:Number(amt),note:$('fNote').value.trim()});
  save();
  $('amountInput').value=''; $('fNote').value='';
  $('amountInput').placeholder='✓ 已记';
  setTimeout(function(){$('amountInput').placeholder='0.00';},800);
});
function save(){ localStorage.setItem(KEY,JSON.stringify(records)); }

/* list */
var curFilter='全部';
function renderList(){
  var bar=$('filterBar'); bar.innerHTML='';
  var all={name:'全部',icon:'📋'};
  [all].concat(CATEGORIES).forEach(function(c){
    var chip=document.createElement('span');
    chip.className='filter-chip'+(curFilter===c.name?' active':'');
    chip.textContent=(c.icon||'')+' '+c.name;
    chip.addEventListener('click', function(){
      curFilter=c.name; renderList();
    });
    bar.appendChild(chip);
  });
  var list=records.filter(function(r){return curFilter==='全部'||r.cat===curFilter;});
  var area=$('listArea');
  if(!list.length){
    area.innerHTML='<div class="list-empty"><img class="empty-mascot" src="blue-icon.png" alt=""><div style="font-size:14px;font-weight:700;margin-top:10px;">还没有记录</div><div style="font-size:12px;color:var(--muted);margin-top:4px;">记下第一笔吧 🐶</div></div>';
    return;
  }
  var html='';
  list.slice().reverse().forEach(function(r){
    var c=CATEGORIES.find(function(x){return x.name===r.cat;})||{};
    html+='<div class="list-item">';
    html+='<div class="cat-dot" style="background:'+(c.color||'var(--ink)')+'"></div>';
    html+='<div class="list-item-info">';
    html+='<div class="li-top"><span class="li-cat">'+r.cat+'</span><span class="li-amt">-'+r.amount.toFixed(2)+'</span></div>';
    html+='<div class="li-note">'+(r.note||'—')+'</div>';
    html+='<div class="li-date">'+r.date+'</div>';
    html+='</div>';
    html+='<button class="del-btn" data-id="'+r.id+'">✕</button>';
    html+='</div>';
  });
  area.innerHTML=html;
  area.querySelectorAll('.del-btn').forEach(function(b){
    b.addEventListener('click', function(){
      if(confirm('删除这条？')){ records=records.filter(function(r){return r.id!==this.dataset.id;}.bind(this)); save(); renderList(); }
    }.bind(this));
  });
}

/* stats */
function renderStats(){
  var sums={},total=0,count=records.length;
  records.forEach(function(r){ sums[r.cat]=(sums[r.cat]||0)+(Number(r.amount)||0); total+=Number(r.amount)||0; });
  var h='<div class="sum-row">';
  h+='<img class="sum-mascot" src="blue-icon.png" alt="">';
  h+='<div class="sum-info"><div class="sum-val">¥'+total.toFixed(2)+'</div><div class="sum-lbl">共 '+count+' 笔</div></div></div>';
  h+='<div class="stats-grid">';
  h+='<div class="stat-card"><div class="stat-val">'+count+'</div><div class="stat-lbl">总笔数</div></div>';
  h+='<div class="stat-card"><div class="stat-val">'+Object.keys(sums).length+'</div><div class="stat-lbl">涉及分类</div></div>';
  h+='</div>';
  h+='<div class="card"><h3>分类统计</h3>';
  CATEGORIES.forEach(function(c){
    var v=sums[c.name]||0;
    if(v===0) return;
    h+='<div class="cat-sum-item">';
    h+='<div class="cat-sum-left"><div class="cat-bar" style="background:'+c.color+'"></div><span style="font-weight:700;font-size:13px;">'+c.icon+' '+c.name+'</span></div>';
    h+='<span style="font-weight:800;font-size:15px;color:var(--ink);">¥'+v.toFixed(2)+'</span>';
    h+='</div>';
  });
  h+='</div>';
  $('statsArea').innerHTML=h;
}
</script>
<script>
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw-blue.js').catch(function(){});}
</script>
</body>
</html>
