<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>致敬老员工</title>
  <style>
    :root {
      --cream:#faf3e8; --paper:#fffdf8; --ink:#5c4a38; --ink-2:#8a7360;
      --muted:#b09579; --line:#eadbcd; --tape:#e8d9c8;
      --accent:#e07b39; --rose:#e8618c; --rose-soft:#fdeef3;
      --gold:#d9a441; --safe-b:env(safe-area-inset-bottom,0px);
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html,body { margin:0; min-height:100%; }
    body {
      background:var(--cream); color:var(--ink);
      font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      -webkit-tap-highlight-color:transparent;
      background-image:radial-gradient(circle at 15% 10%, rgba(232,97,140,.06), transparent 40%),
                        radial-gradient(circle at 85% 30%, rgba(224,123,57,.06), transparent 40%);
    }
    .wrap { max-width:560px; margin:0 auto; padding:20px 18px calc(140px + var(--safe-b)); }
    .card {
      background:var(--paper); border:2px solid var(--ink); border-radius:22px;
      padding:26px 22px; margin-bottom:18px;
      box-shadow:6px 6px 0 rgba(92,74,56,.12);
    }
    .tag {
      display:inline-block; background:var(--ink); color:#fff; font-size:11px; font-weight:700;
      letter-spacing:.25em; padding:5px 14px 5px 16px; border-radius:20px; margin-bottom:14px;
    }
    h1 { margin:0 0 6px; font-size:30px; line-height:1.3; }
    .sub { color:var(--ink-2); font-size:13px; margin-bottom:18px; }
    .photo-frame {
      width:100%; aspect-ratio:4/3; border-radius:16px; border:2px dashed var(--tape);
      overflow:hidden; background:var(--rose-soft); display:flex; align-items:center; justify-content:center;
      margin-bottom:18px;
    }
    .photo-frame img { width:100%; height:100%; object-fit:cover; display:block; }
    .photo-frame .ph { color:var(--muted); font-size:13px; }
    .story { font-size:15.5px; line-height:1.9; white-space:pre-wrap; }
    .story strong { color:var(--accent); }
    .meta-row { display:flex; gap:10px; margin-bottom:16px; }
    .meta-chip { flex:1; background:var(--rose-soft); border-radius:12px; padding:10px 8px; text-align:center; }
    .meta-chip .mv { font-size:19px; font-weight:800; color:var(--rose); }
    .meta-chip .ml { font-size:11px; color:var(--ink-2); font-weight:600; margin-top:1px; }
    .footer-note { text-align:center; color:var(--muted); font-size:12px; margin-top:26px; }
    /* 全屏撒花（从上往下） */
    .rain-flower {
      position:fixed; top:-8vh; z-index:60; pointer-events:none;
      font-size:34px; will-change:transform,opacity;
      animation:falldown linear forwards;
    }
    @keyframes falldown {
      0% { opacity:0; transform:translateY(0) rotate(0); }
      6% { opacity:1; }
      100% { opacity:.9; transform:translateY(115vh) rotate(300deg); }
    }
    /* 送花人列表 */
    .sender-card { padding:16px 16px 8px; }
    .sender-head {
      display:flex; align-items:center; justify-content:space-between;
      font-size:12px; font-weight:800; letter-spacing:.2em; color:var(--ink-2);
      border-bottom:2px solid var(--rose-soft); padding-bottom:8px; margin-bottom:4px;
    }
    .sender-item {
      display:flex; align-items:center; gap:10px; padding:9px 2px;
      border-bottom:1px dashed var(--line); font-size:14px;
    }
    .sender-item:last-child { border-bottom:none; }
    .sender-item .sf { font-size:18px; }
    .sender-item .sn { font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sender-item .st { font-size:11px; color:var(--muted); }
    .sender-del {
      flex:none; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line);
      background:none; color:var(--muted); font-size:12px; line-height:1; cursor:pointer;
      display:flex; align-items:center; justify-content:center; padding:0;
    }
    .sender-del:hover { border-color:var(--rose); color:var(--rose); }
    .sender-empty { text-align:center; color:var(--muted); font-size:13px; padding:16px 0 20px; }
    /* 编辑模式 */
    #editBtn {
      position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); right:12px; z-index:70;
      width:38px; height:38px; border-radius:50%; border:2px solid var(--ink);
      background:var(--paper); font-size:16px; cursor:pointer; line-height:1;
      box-shadow:3px 3px 0 rgba(92,74,56,.15);
    }
    #editMask {
      position:fixed; inset:0; z-index:80; background:rgba(92,74,56,.35);
      display:flex; align-items:flex-end; justify-content:center;
    }
    #editPanel {
      width:100%; max-width:560px; max-height:82vh; overflow-y:auto;
      background:var(--paper); border:2px solid var(--ink); border-bottom:none;
      border-radius:24px 24px 0 0; padding:20px 18px calc(20px + var(--safe-b));
    }
    #editPanel h3 { margin:0 0 14px; font-size:15px; letter-spacing:.15em; }
    .efield { margin-bottom:12px; }
    .efield label { display:block; font-size:11px; font-weight:800; color:var(--ink-2); letter-spacing:.1em; margin-bottom:4px; }
    .efield input[type=text], .efield textarea {
      width:100%; border:2px solid var(--ink); border-radius:12px; padding:9px 12px;
      font:inherit; font-size:14px; background:var(--cream);
    }
    .efield textarea { min-height:110px; resize:vertical; line-height:1.7; }
    #photoPick {
      display:block; width:100%; min-height:48px; border:2px dashed var(--ink-2); border-radius:12px;
      background:var(--cream); color:var(--ink-2); font:inherit; font-weight:700; cursor:pointer; text-align:center;
    }
    .edit-btns { display:flex; gap:10px; margin-top:6px; }
    .edit-btns button {
      flex:1; min-height:48px; border-radius:14px; border:2px solid var(--ink);
      font:inherit; font-size:15px; font-weight:800; cursor:pointer;
    }
    #editSave { background:var(--ink); color:#fff; }
    #editReset { background:var(--paper); color:var(--ink); }
    /* 底部操作栏 */
    #dock {
      position:fixed; left:0; right:0; bottom:0; z-index:50;
      padding:12px 16px calc(14px + var(--safe-b));
      background:rgba(250,243,232,.92); backdrop-filter:blur(10px);
      border-top:2px solid var(--line);
    }
    .dock-inner { max-width:560px; margin:0 auto; display:flex; gap:10px; align-items:center; }
    #flowerBtn {
      flex:none; min-height:54px; padding:0 22px; border-radius:18px; border:2px solid var(--ink);
      background:linear-gradient(135deg,var(--rose),#f0866); background:var(--rose); color:#fff;
      font-size:18px; font-weight:800; letter-spacing:.1em; cursor:pointer;
      box-shadow:4px 4px 0 rgba(92,74,56,.18);
    }
    #flowerBtn:active { transform:translate(3px,3px); box-shadow:none; }
    #nameInput {
      flex:1; min-width:0; min-height:54px; border-radius:18px; border:2px solid var(--ink);
      background:var(--paper); padding:0 16px; font:inherit; font-weight:600;
    }
    /* 送花滚动条 */
    #ticker {
      max-width:560px; margin:0 auto 10px; height:34px; overflow:hidden; position:relative;
      border-radius:12px; background:var(--paper); border:2px solid var(--line);
    }
    .ticker-item {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:6px;
      font-size:13px; font-weight:600; color:var(--ink-2);
      animation:tickin .5s ease, tickout .5s ease 2.3s forwards;
    }
    @keyframes tickin { from { opacity:0; transform:translateY(100%);} to { opacity:1; transform:translateY(0);} }
    @keyframes tickout { to { opacity:0; transform:translateY(-100%);} }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="tag" id="cTag">致敬</span>
    <h1 id="cTitle">（标题）</h1>
    <div class="sub" id="cSub">（副标题）</div>
    <div class="photo-frame"><span class="ph">🌸 照片位</span></div>
    <div class="meta-row" id="cMeta"></div>
    <div class="story" id="cStory">（正文）</div>
  </div>
  <div class="card sender-card">
    <div class="sender-head"><span>🌷 送花名单</span><span id="senderCount"></span></div>
    <div id="senderList"></div>
  </div>
  <div class="footer-note" id="cFooter"></div>
</div>

<button id="editBtn" title="编辑内容">✏️</button>
<div id="editMask" hidden>
  <div id="editPanel">
    <h3>✏️ 编辑内容（换人复用）</h3>
    <div class="efield"><label>角标</label><input type="text" id="eTag"></div>
    <div class="efield"><label>标题</label><input type="text" id="eTitle"></div>
    <div class="efield"><label>副标题</label><input type="text" id="eSub"></div>
    <div class="efield"><label>照片（直接从手机/电脑选择）</label><button id="photoPick">📷 点击选择照片</button></div>
    <div class="efield"><label>数据位一（如：入职年份）</label><input type="text" id="eMeta1" placeholder="标签,值"></div>
    <div class="efield"><label>数据位二（如：坚守岗位）</label><input type="text" id="eMeta2" placeholder="标签,值"></div>
    <div class="efield"><label>正文（换行用空行）</label><textarea id="eStory"></textarea></div>
    <div class="edit-btns">
      <button id="editReset">恢复默认</button>
      <button id="editSave">保存</button>
    </div>
  </div>
</div>

<div id="dock">
  <div class="ticker-wrap">
    <div id="ticker"><div class="ticker-item" style="animation:none;">🌸 欢迎送花致敬</div></div>
  </div>
  <div class="dock-inner">
    <input type="text" id="nameInput" placeholder="你的名字" maxlength="12">
    <button id="flowerBtn">🌷 送花</button>
  </div>
</div>
  <script>
    /* ===== 灵魂配置区：改这里就能换人复用 ===== */
    var CONFIG = {
      tag: '致敬老员工',
      title: '十年坚守，感谢有你',
      sub: '2026年度 · 员工表彰',
      photo: '',                // 照片URL或相对路径，留空显示占位
      photoPlaceholder: '🌸 照片位',
      metas: [                  // 三个数据位，可自由增删
        { label: '入职年份', value: '2016' },
        { label: '坚守岗位', value: '10年' },
        { label: '累计送花', value: '0朵' },
      ],
      story: '十年前你推开了这扇门，\n十年后这扇门因为你的坚守而温暖。\n\n每一份认真都值得被看见，\n每一份坚守都值得被致敬。\n\n这束花，送给你。',
      footer: '点击下方「送花」，为你致敬的人献上一朵 🌷',
      flowers: ['🌷','🌹','🌻','🌸','💐','🪻'],   // 送花动画随机用花
      initialCount: 0,          // 初始花数（写死一个基数）
    };
    /* ===== 配置区结束，以下不用动 ===== */

    var CFG_KEY = 'tribute-config';
    try {
      var saved = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
      for (var k in saved) CONFIG[k] = saved[k];
    } catch(e) {}

    function $(id){ return document.getElementById(id); }

    // 渲染配置
    $('cTag').textContent = CONFIG.tag;
    $('cTitle').textContent = CONFIG.title;
    $('cSub').textContent = CONFIG.sub;
    $('cStory').textContent = CONFIG.story;
    $('cFooter').textContent = CONFIG.footer;
    if (CONFIG.photo) {
      var img = document.createElement('img');
      img.src = CONFIG.photo; img.alt = '';
      document.querySelector('.photo-frame').innerHTML = '';
      document.querySelector('.photo-frame').appendChild(img);
    } else if (CONFIG.photoPlaceholder) {
      document.querySelector('.photo-frame .ph').textContent = CONFIG.photoPlaceholder;
    }
    var metaHtml = '';
    CONFIG.metas.forEach(function(m){
      metaHtml += '<div class="meta-chip"><div class="mv">'+m.value+'</div><div class="ml">'+m.label+'</div></div>';
    });
    $('cMeta').innerHTML = metaHtml;

    // 送花状态（本地）
    var KEY = 'tribute-flowers';
    var state = {};
    try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { state = {}; }
    if (!state.count) state.count = CONFIG.initialCount;
    if (!state.senders) state.senders = [];   // [{n:名字, t:时间}]
    state.names = state.senders.map(function(s){ return s.n; });

    function saveState(){ localStorage.setItem(KEY, JSON.stringify(state)); }
    function updateCountChip(){
      var chip = document.querySelector('.meta-chip .mv');
      if (CONFIG.metas.length) {
        var idx = -1;
        CONFIG.metas.forEach(function(m,i){ if(m.label.indexOf('花')>-1) idx=i; });
        if (idx>-1) document.querySelectorAll('.meta-chip .mv')[idx].textContent = state.count + '朵';
      }
    }
    updateCountChip();

    // 滚动显示送花人：持续轮播，新送花的优先插播
    var tickerTimer = null;
    var queue = [];   // 待插播的消息
    var rotIdx = 0;

    function displayTicker(text){
      var t = $('ticker');
      var el = document.createElement('div');
      el.className = 'ticker-item';
      el.textContent = text;
      t.innerHTML = '';
      t.appendChild(el);
    }

    function nextTicker(){
      if (queue.length) {
        displayTicker(queue.shift());
        return;
      }
      // 轮播：欢迎语 + 历史送花人
      var recent = state.names.slice(-10);
      var pool = recent.length
        ? recent.map(function(n){ return '🌸 ' + n + ' 已送花'; })
        : ['🌸 欢迎送花致敬'];
      rotIdx = rotIdx % pool.length;
      displayTicker(pool[rotIdx]);
      rotIdx++;
    }

    nextTicker();
    tickerTimer = setInterval(nextTicker, 3000);

    function showTicker(name, flower){
      queue.push(flower + ' ' + name + ' 送出了一朵花');
      clearInterval(tickerTimer);
      nextTicker();
      tickerTimer = setInterval(nextTicker, 3000);
    }

    // 送花人列表
    function fmtTime(ts){
      var d = new Date(ts);
      return (d.getMonth()+1) + '月' + d.getDate() + '日 ' +
        String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
    function renderSenders(){
      var list = $('senderList');
      $('senderCount').textContent = '共 ' + state.count + ' 朵';
      if (!state.senders.length) {
        list.innerHTML = '<div class="sender-empty">还没有人送花，来当第一朵吧 🌷</div>';
        return;
      }
      var html = '';
      state.senders.slice().reverse().forEach(function(s){
        html += '<div class="sender-item"><span class="sf">🌷</span><span class="sn">' +
          s.n.replace(/</g,'&lt;') + '</span><span class="st">' + fmtTime(s.t) +
          '</span><button class="sender-del" data-t="' + s.t + '">✕</button></div>';
      });
      list.innerHTML = html;
      list.querySelectorAll('.sender-del').forEach(function(b){
        b.addEventListener('click', function(){
          state.senders = state.senders.filter(function(s){ return String(s.t) !== b.dataset.t; });
          state.names = state.senders.map(function(s){ return s.n; });
          if (state.count > 0) state.count--;
          saveState(); updateCountChip(); renderSenders();
        });
      });
    }
    renderSenders();

    // 全屏撒花特效：从上往下，大面积
    function rainFlowers(){
      var n = 36;
      for (var i=0; i<n; i++) {
        (function(i){
          setTimeout(function(){
            var f = document.createElement('div');
            f.className = 'rain-flower';
            f.textContent = CONFIG.flowers[Math.floor(Math.random()*CONFIG.flowers.length)];
            f.style.left = (Math.random()*100) + '%';
            f.style.fontSize = (22 + Math.random()*26) + 'px';
            f.style.animationDuration = (1.8 + Math.random()*1.8) + 's';
            f.style.animationDelay = (Math.random()*0.3) + 's';
            document.body.appendChild(f);
            setTimeout(function(){ f.remove(); }, 4200);
          }, i*45);
        })(i);
      }
    }

    // 送花动作
    $('flowerBtn').addEventListener('click', function(){
      var name = $('nameInput').value.trim() || '一位同事';
      var flower = CONFIG.flowers[Math.floor(Math.random()*CONFIG.flowers.length)];
      state.count++;
      state.senders.push({ n:name, t:Date.now() });
      state.names.push(name);
      saveState();
      updateCountChip();
      renderSenders();
      showTicker(name, flower);
      rainFlowers();
      $('nameInput').select();
    });

    /* ===== 编辑模式：页面内直接改文字、传照片 ===== */
    var DEFAULTS = JSON.parse(JSON.stringify(CONFIG));
    $('editBtn').addEventListener('click', function(){
      $('eTag').value = CONFIG.tag;
      $('eTitle').value = CONFIG.title;
      $('eSub').value = CONFIG.sub;
      $('eStory').value = CONFIG.story;
      $('eMeta1').value = CONFIG.metas[0] ? CONFIG.metas[0].label + ',' + CONFIG.metas[0].value : '';
      $('eMeta2').value = CONFIG.metas[1] ? CONFIG.metas[1].label + ',' + CONFIG.metas[1].value : '';
      $('photoPick').textContent = CONFIG.photo ? '📷 已有照片，点击更换' : '📷 点击选择照片';
      $('editMask').hidden = false;
    });
    $('editMask').addEventListener('click', function(e){
      if (e.target === this) this.hidden = true;
    });
    $('photoPick').addEventListener('click', function(){
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = function(){
        if (!inp.files[0]) return;
        var fr = new FileReader();
        fr.onload = function(){
          CONFIG.photo = fr.result;
          $('photoPick').textContent = '✓ 已选好照片，保存后生效';
        };
        fr.readAsDataURL(inp.files[0]);
      };
      inp.click();
    });
    function parseMeta(s, fallback){
      var p = s.split(',');
      if (p.length >= 2) return { label:p[0].trim(), value:p.slice(1).join(',').trim() };
      return fallback;
    }
    $('editSave').addEventListener('click', function(){
      CONFIG.tag = $('eTag').value.trim() || CONFIG.tag;
      CONFIG.title = $('eTitle').value.trim() || CONFIG.title;
      CONFIG.sub = $('eSub').value.trim();
      CONFIG.story = $('eStory').value;
      if (CONFIG.metas[0]) CONFIG.metas[0] = parseMeta($('eMeta1').value, CONFIG.metas[0]);
      if (CONFIG.metas[1]) CONFIG.metas[1] = parseMeta($('eMeta2').value, CONFIG.metas[1]);
      localStorage.setItem(CFG_KEY, JSON.stringify(CONFIG));
      location.reload();
    });
    $('editReset').addEventListener('click', function(){
      if (confirm('恢复默认文字和照片？送花记录保留。')) {
        localStorage.removeItem(CFG_KEY);
        location.reload();
      }
    });
  </script>
</body>
</html>
