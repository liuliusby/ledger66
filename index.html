<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="66私房帐">
  <link rel="apple-touch-icon" href="mascot-icon.png">
  <meta name="theme-color" content="#1c1a17">
  <title>66私房帐</title>
  <style>
    :root {
      --ink:#292c30; --ink-2:#4c5056; --muted:#85898f;
      --line:#e3e5e8; --line-2:#eceef0; --paper:#fff; --bg:#f4f5f7;
      --accent:#ed9562; --accent-strong:#d97745; --accent-soft:#fff4ec;
      --success:#4f8659; --success-soft:#f1f8f2;
      --danger:#c34f43; --danger-soft:#fff2f0;
      --shadow:0 8px 28px rgba(44,48,54,.06);
      --safe-b:env(safe-area-inset-bottom,0px);
      --cream:#faf7f2; --ink-black:#1c1a17; --tape:#e8e2d6;
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html,body { height:100%; margin:0; }
    body {
      background:var(--cream); color:var(--ink-black);
      font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      -webkit-tap-highlight-color:transparent;
    }    #app { display:flex; flex-direction:column; height:100%; max-width:520px; margin:0 auto; background:var(--cream); }
    #appHeader {
      padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 12px;
      background:var(--ink-black); color:#fff;
    }
    #appHeader h1 { margin:0; font-size:26px; font-weight:800; letter-spacing:.02em; }
    #appHeader .head-sub { color:rgba(255,255,255,.55); font-size:11px; letter-spacing:.18em; text-transform:uppercase; }
    #appMain { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px 24px; }
    #appNav {
      display:flex; padding:8px 12px calc(8px + var(--safe-b));
      background:var(--ink-black);
    }
    .nav-btn {
      flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
      padding:8px 0 5px; border:none; background:none; color:rgba(255,255,255,.45);
      font-size:11px; font-weight:650; letter-spacing:.08em; min-height:auto; border-radius:10px; cursor:pointer;
    }
    .nav-btn svg { width:23px; height:23px; }
    .nav-btn.active { color:#fff; background:rgba(255,255,255,.12); }
    .nav-btn:hover { background:none; color:inherit; }
    .nav-btn.active:hover { color:#fff; }
    .page { display:none; }
    .page.active { display:block; }
    .card { background:var(--paper); border:2px solid var(--ink-black); border-radius:18px; padding:18px 16px; margin-bottom:16px; box-shadow:5px 5px 0 rgba(28,26,23,.9); }
    .card h3 { margin:0 0 14px; font-size:12px; font-weight:800; letter-spacing:.22em; color:var(--ink-black); text-transform:uppercase; border-bottom:2px solid var(--ink-black); padding-bottom:8px; }
    .amount-box { display:flex; align-items:baseline; gap:6px; margin-bottom:4px; }
    .amount-box .cny { font-size:26px; font-weight:800; color:var(--ink-black); }
    #amountInput {
      flex:1; width:100%; min-width:0; min-height:56px; border:none; border-radius:0; background:none;
      font-size:44px; font-weight:800; letter-spacing:-.02em; padding:0; color:var(--ink-black);
      font-variant-numeric:tabular-nums; -moz-appearance:textfield; appearance:textfield;
    }
    #amountInput::-webkit-outer-spin-button,#amountInput::-webkit-inner-spin-button { -webkit-appearance:none; }
    #amountInput::placeholder { color:var(--tape); }
    .amount-rule { height:0; border-bottom:2px dashed var(--tape); margin:8px 0 16px; }
    .cat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
    .cat-btn {
      min-height:auto; padding:11px 2px 9px; border-radius:13px; font-size:13px; font-weight:650;
      background:var(--paper); border:2px solid var(--ink-black); color:var(--ink-black); cursor:pointer;
      box-shadow:3px 3px 0 rgba(28,26,23,.9);
    }
    .cat-btn.sel { background:var(--ink-black); color:#fff; box-shadow:none; transform:translate(3px,3px); }
    .field-row { display:flex; gap:10px; margin-bottom:14px; }
    .field-row label { flex:1; display:grid; gap:5px; color:var(--ink-2); font-size:11px; font-weight:700; letter-spacing:.1em; }
    .field-row input { min-width:0; min-height:42px; border-radius:10px; border:2px solid var(--ink-black); padding:0 11px; font:inherit; font-weight:600; width:100%; background:var(--paper); }
    .save-btn {
      width:100%; min-height:52px; border:2px solid var(--ink-black); border-radius:14px;
      background:var(--accent); color:var(--ink-black); font-size:17px; font-weight:800; letter-spacing:.3em; cursor:pointer;
      box-shadow:4px 4px 0 rgba(28,26,23,.9);
    }
    .save-btn:active { box-shadow:none; transform:translate(4px,4px); }
    .form-hint { color:var(--danger); font-size:12px; min-height:18px; margin:10px 0 0; text-align:center; font-weight:650; }
    .ticket {
      position:relative; display:flex; align-items:center; gap:12px; padding:15px 16px 15px 20px;
      background:var(--paper); border:2px solid var(--ink-black); border-radius:16px; margin-bottom:12px;
      box-shadow:4px 4px 0 rgba(28,26,23,.9);
    }
    .ticket::before {
      content:""; position:absolute; left:-2px; top:50%; transform:translateY(-50%);
      width:6px; height:60%; border-radius:0 4px 4px 0; background:var(--cat-color,#1c1a17);
    }
    .ticket .li-icon { width:44px; height:44px; border-radius:12px; border:2px solid var(--ink-black); display:flex; align-items:center; justify-content:center; font-size:20px; flex:none; }
    .li-body { flex:1; min-width:0; }
    .li-note { font-size:15px; font-weight:700; color:var(--ink-black); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .li-date { font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.04em; }
    .li-amt { font-weight:800; font-size:19px; font-variant-numeric:tabular-nums; color:var(--ink-black); }
    .li-del { border:none; background:none; color:var(--muted); min-height:auto; padding:8px; font-size:14px; font-weight:700; cursor:pointer; border-radius:8px; }
    .li-del:hover { color:var(--danger); background:var(--danger-soft); }
    .filter-chips { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 14px; }
    .f-chip { flex:none; min-height:auto; padding:7px 16px; border-radius:999px; font-size:13px; font-weight:700; border:2px solid var(--ink-black); background:var(--paper); color:var(--ink-black); cursor:pointer; }
    .f-chip.sel { background:var(--ink-black); color:#fff; }
    .empty { padding:48px 16px; color:var(--muted); text-align:center; font-size:14px; }
    .sum-hero { text-align:left; padding:2px 0 6px; }
    .sum-hero .sh-label { color:var(--ink-2); font-size:11px; font-weight:800; letter-spacing:.22em; text-transform:uppercase; }
    .sum-hero .sh-value { font-size:52px; font-weight:900; letter-spacing:-.03em; color:var(--ink-black); font-variant-numeric:tabular-nums; line-height:1.15; }
    .sum-hero #statsCount { font-size:13px; font-weight:600; }
    .stat-row { display:flex; align-items:center; gap:10px; margin-bottom:13px; }
    .stat-row .sr-cat { width:66px; flex:none; font-size:14px; font-weight:800; color:var(--ink-black); }
    .stat-row .sr-bar-wrap { flex:1; height:16px; background:var(--cream); border:2px solid var(--ink-black); border-radius:8px; overflow:hidden; }
    .stat-row .sr-bar { height:100%; }
    .stat-row .sr-val { width:92px; flex:none; text-align:right; font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--ink-black); }
    .stat-row .sr-pct { width:42px; flex:none; text-align:right; font-size:12px; font-weight:700; color:var(--muted); }
    .month-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .month-cell { padding:12px 14px; border:2px solid var(--ink-black); border-radius:12px; background:var(--paper); box-shadow:3px 3px 0 rgba(28,26,23,.9); }
    .month-cell .mc-m { font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--ink-2); }
    .month-cell .mc-v { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--ink-black); }

    #appHeader { display:flex; align-items:center; justify-content:space-between; }
    #headerText { flex:1; }
    .mascot-head { width:64px; height:64px; border-radius:50%; border:2.5px solid #fff; object-fit:cover; object-position:top; flex:none; box-shadow:0 2px 10px rgba(0,0,0,.35); }
    .empty-mascot { width:150px; height:150px; border-radius:24px; border:2px solid var(--ink-black); object-fit:cover; object-position:top; box-shadow:5px 5px 0 rgba(28,26,23,.9); margin:0 auto 14px; display:block; background:var(--paper); }
    #saveToast {
      position:fixed; left:50%; bottom:calc(96px + var(--safe-b)); transform:translateX(-50%) translateY(20px);
      display:flex; align-items:center; gap:10px; padding:10px 18px 10px 10px;
      background:var(--ink-black); color:#fff; border-radius:16px; font-weight:700; font-size:14px;
      opacity:0; pointer-events:none; transition:all .25s ease; z-index:99; white-space:nowrap;
    }
    #saveToast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #saveToast img { width:36px; height:36px; border-radius:50%; object-fit:cover; object-position:top; border:2px solid var(--accent); }
    .sum-mascot { width:76px; height:76px; border-radius:20px; border:2px solid var(--ink-black); object-fit:cover; object-position:top; box-shadow:4px 4px 0 rgba(28,26,23,.9); flex:none; }
    .sum-hero-row { display:flex; align-items:center; gap:14px; }
    .confirm-card { padding:14px 16px; border:2px solid var(--danger); background:var(--danger-soft); border-radius:13px; margin-bottom:12px; display:flex; gap:10px; align-items:center; justify-content:space-between; font-weight:650; }
    .confirm-card .cc-btns { display:flex; gap:8px; }
    .confirm-card button { min-height:34px; font-weight:700; }
  </style>
</head>

  </div>
  <script>
    var CATS = [
      { name:'出行',    icon:'🚕', color:'#4a90d9', bg:'#eaf3fc' },
      { name:'娱乐',    icon:'🎬', color:'#ed9562', bg:'#fff4ec' },
      { name:'投资',    icon:'📈', color:'#4f8659', bg:'#f1f8f2' },
      { name:'软件支出', icon:'💻', color:'#9b6dc3', bg:'#f4effa' }
    ];
    var KEY = 'moma-zhangwu-records';
    var records = [];
    try { records = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { records = []; }
    var $ = function (id) { return document.getElementById(id); };
    var curCat = CATS[0].name, curFilter = '全部';
    var fDate = $('fDate'), fNote = $('fNote'), amountInput = $('amountInput');

    function catOf(name) { return CATS.filter(function(c){ return c.name === name; })[0] || CATS[0]; }
    function todayStr() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    function fmt(n) { return n.toLocaleString('zh-CN', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
    function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function save() { localStorage.setItem(KEY, JSON.stringify(records)); }

    // --- 记一笔 ---
    var catGrid = $('catGrid');
    CATS.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'cat-btn' + (c.name === curCat ? ' sel' : '');
      b.textContent = c.name;
      b.addEventListener('click', function () {
        curCat = c.name;
        catGrid.querySelectorAll('.cat-btn').forEach(function (x) { x.classList.remove('sel'); });
        b.classList.add('sel');
      });
      catGrid.appendChild(b);
    });

    $('saveBtn').addEventListener('click', function () {
      var amt = parseFloat(amountInput.value);
      if (!isFinite(amt) || amt <= 0) { $('formHint').textContent = '请输入大于 0 的金额'; return; }
      $('formHint').textContent = '';
      records.push({ id: Date.now() + '-' + Math.floor(Math.random()*1e5), date: fDate.value || todayStr(), cat: curCat, amount: amt, note: fNote.value.trim() });
      save();
      amountInput.value = ''; fNote.value = '';
      var toast = $('saveToast');
      toast.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
    });

    // --- 明细 ---
    function renderFilter() {
      var chips = ['全部'].concat(CATS.map(function (c) { return c.name; }));
      var host = $('filterChips');
      host.innerHTML = '';
      chips.forEach(function (name) {
        var b = document.createElement('button');
        b.className = 'f-chip' + (name === curFilter ? ' sel' : '');
        b.textContent = name;
        b.addEventListener('click', function () { curFilter = name; renderFilter(); renderList(); });
        host.appendChild(b);
      });
    }
    function renderList() {
      var list = records.filter(function (r) { return curFilter === '全部' || r.cat === curFilter; });
      list.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      $('listEmpty').hidden = list.length > 0;
      var host = $('listBody');
      host.innerHTML = '';
      list.forEach(function (r) {
        var c = catOf(r.cat);
        var div = document.createElement('div');
        div.className = 'ticket';
        div.style.setProperty('--cat-color', c.color);
        div.innerHTML = '<div class="li-icon" style="background:'+c.bg+'">'+c.icon+'</div>'
          + '<div class="li-body"><div class="li-note">'+(esc(r.note) || r.cat)+'</div><div class="li-date">'+r.date+' · '+r.cat+'</div></div>'
          + '<div class="li-amt" style="color:'+c.color+'">¥'+fmt(r.amount)+'</div>'
          + '<button class="li-del" data-id="'+r.id+'">✕</button>';
        host.appendChild(div);
      });
    }
    $('listBody').addEventListener('click', function (e) {
      var btn = e.target.closest('.li-del');
      if (!btn) return;
      var id = btn.getAttribute('data-id');
      var host = $('listBody');
      if (host.querySelector('.confirm-card')) return;
      var card = document.createElement('div');
      card.className = 'confirm-card';
      card.innerHTML = '<span>删除这条记录?</span><span class="cc-btns"><button data-act="cancel">取消</button><button data-act="ok" style="background:var(--danger);border-color:var(--danger);color:#fff">删除</button></span>';
      host.insertBefore(card, host.firstChild);
      card.addEventListener('click', function (ev) {
        var act = ev.target.getAttribute && ev.target.getAttribute('data-act');
        if (act === 'cancel') card.remove();
        if (act === 'ok') {
          records = records.filter(function (r) { return r.id !== id; });
          save(); card.remove(); renderList();
        }
      });
    });

    // --- 统计 ---
    function renderStats() {
      var sums = {}, total = 0;
      CATS.forEach(function (c) { sums[c.name] = 0; });
      records.forEach(function (r) { sums[r.cat] = (sums[r.cat]||0) + (Number(r.amount)||0); total += Number(r.amount)||0; });
      $('statsTotal').textContent = '¥ ' + fmt(total);
      $('statsCount').textContent = '共 ' + records.length + ' 笔';
      var maxV = Math.max.apply(null, CATS.map(function (c) { return sums[c.name]; }).concat([1]));
      var rows = $('barRows'); rows.innerHTML = '';
      CATS.forEach(function (c) {
        var v = sums[c.name], pct = total > 0 ? Math.round(v/total*100) : 0;
        var div = document.createElement('div');
        div.className = 'stat-row';
        div.innerHTML = '<div class="sr-cat">'+c.name+'</div>'
          + '<div class="sr-bar-wrap"><div class="sr-bar" style="width:'+(v/maxV*100)+'%;background:'+c.color+'"></div></div>'
          + '<div class="sr-val">¥'+fmt(v)+'</div><div class="sr-pct">'+pct+'%</div>';
        rows.appendChild(div);
      });
      var byMonth = {};
      records.forEach(function (r) {
        var m = r.date.slice(0, 7);
        byMonth[m] = (byMonth[m]||0) + (Number(r.amount)||0);
      });
      var months = Object.keys(byMonth).sort().reverse().slice(0, 6);
      var mg = $('monthGrid'); mg.innerHTML = '';
      if (!months.length) { mg.innerHTML = '<div class="empty" style="grid-column:1/-1;padding:20px">暂无数据</div>'; return; }
      months.forEach(function (m) {
        var div = document.createElement('div');
        div.className = 'month-cell';
        div.innerHTML = '<div class="mc-m">'+m.replace('-','年')+'月</div><div class="mc-v">¥'+fmt(byMonth[m])+'</div>';
        mg.appendChild(div);
      });
    }

    // --- 导航 ---
    var titles = { pageAdd:['66私房帐','EXPENSE JOURNAL · 记一笔'], pageList:['账单','ALL RECORDS · 明细'], pageStats:['统计','WHERE MONEY GOES · 去哪了'] };
    document.querySelectorAll('.nav-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var page = btn.getAttribute('data-page');
        document.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
        $(page).classList.add('active');
        $('headerTitle').textContent = titles[page][0];
        $('headerSub').textContent = titles[page][1];
        $('appMain').scrollTop = 0;
        if (page === 'pageList') renderList();
        if (page === 'pageStats') renderStats();
      });
    });

    fDate.value = todayStr();
    renderFilter(); renderList(); renderStats();
  </script>
</body>
</html>
